auth_enabled: false # Loopback only. Remote ingestion is behind the mTLS gateway.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
memberlist:
  bind_addr: [127.0.0.1]
  advertise_addr: 127.0.0.1
  join_members: []
frontend:
  address: 127.0.0.1
schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /loki/chunks
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  retention_stream:
    - selector: '{job="management"}'
      priority: 1
      period: 720h
  ingestion_rate_mb: 0.05
  ingestion_burst_size_mb: 1
  max_global_streams_per_user: 100
  max_line_size: 4096
  reject_old_samples: true
  reject_old_samples_max_age: 168h
analytics:
  reporting_enabled: false

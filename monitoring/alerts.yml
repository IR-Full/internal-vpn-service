apiVersion: 1
groups:
- orgId: 1
  name: private-vpn
  folder: Private VPN
  interval: 20s
  rules:
  - uid: vpn-stale
    title: Node telemetry is stale
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Node telemetry is stale
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - vpn_probe_timestamp_seconds
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 120
          operator:
            type: and
  - uid: vpn-interface
    title: VPN interface is down
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: VPN interface is down
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_interface_up
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
  - uid: vpn-cpu
    title: CPU saturation
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: CPU saturation
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - avg by(node)(rate(node_cpu_seconds_total{mode="idle"}[2m])))
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 85
          operator:
            type: and
  - uid: vpn-memory
    title: Memory pressure
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Memory pressure
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 85
          operator:
            type: and
  - uid: vpn-disk
    title: Low host disk space
    condition: B
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Low host disk space
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_root_disk_free_ratio
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 0.8
          operator:
            type: and
  - uid: vpn-telemetry
    title: Telemetry ingestion gateway unavailable
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Telemetry ingestion gateway unavailable
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_telemetry_reachable
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
  - uid: vpn-backup
    title: Backup missing or older than 26 hours
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Backup missing or older than 26 hours
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - vpn_backup_success_timestamp_seconds
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 93600
          operator:
            type: and
  - uid: vpn-auth
    title: Repeated administrative authentication failures
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Repeated administrative authentication failures
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: vpn_admin_auth_failures_5m
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 10
          operator:
            type: and
  - uid: vpn-ddos
    title: 'Possible flood: high packet rate and firewall drops'
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: 'Possible flood: high packet rate and firewall drops'
      runbook_url: docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by(node)(rate(node_network_receive_packets_total{device!~"lo|vpn0|wg-mgmt|docker.*|veth.*|br-.*"}[2m]))
          > bool 200000) * (sum by(node)(rate(vpn_firewall_input_drops_total[2m]))
          > bool 10000)
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: classic_conditions
        conditions:
        - type: query
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and

apiVersion: 1
groups:
- orgId: 1
  name: private-vpn
  folder: Private VPN
  interval: 20s
  rules:
  - uid: vpn-stale
    title: Node telemetry is stale or missing
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Node telemetry is stale or missing
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (max by(node)(time() - vpn_probe_timestamp_seconds) > bool 120) or on(node)
          absent(vpn_probe_timestamp_seconds{node="vpn_a"}) or on(node) absent(vpn_probe_timestamp_seconds{node="vpn_b"})
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0
  - uid: vpn-interface
    title: VPN interface is down
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: VPN interface is down
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_interface_up
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0
  - uid: vpn-cpu
    title: CPU saturation
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: CPU saturation
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - avg by(node)(rate(node_cpu_seconds_total{mode="idle"}[2m])))
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 85
  - uid: vpn-memory
    title: Memory pressure
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Memory pressure
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 85
  - uid: vpn-disk
    title: Low host disk space
    condition: B
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Low host disk space
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_root_disk_free_ratio
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0.8
  - uid: vpn-telemetry
    title: Telemetry ingestion gateway unavailable
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Telemetry ingestion gateway unavailable
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - vpn_telemetry_reachable
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0
  - uid: vpn-backup
    title: Backup missing or older than 26 hours
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Backup missing or older than 26 hours
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - vpn_backup_success_timestamp_seconds
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 93600
  - uid: vpn-certificate
    title: Telemetry certificate expires within 30 days or cannot be read
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Telemetry certificate expires within 30 days or cannot be read
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 30 * 86400 - (vpn_telemetry_certificate_expiry_timestamp_seconds - time())
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0
  - uid: vpn-revision
    title: VPN nodes have different configuration revisions
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: VPN nodes have different configuration revisions
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(vpn_fleet_revision) - min(vpn_fleet_revision)
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0
  - uid: vpn-auth
    title: Repeated administrative authentication failures
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: Repeated administrative authentication failures
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: vpn_admin_auth_failures_5m
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 10
  - uid: vpn-ddos
    title: 'Possible flood: high packet rate and firewall drops'
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      service: private-vpn
    annotations:
      summary: 'Possible flood: high packet rate and firewall drops'
      description: 'Node: {{ $labels.node }}; see dashboard for fleet-wide alerts.'
      runbook_url: https://github.com/IR-Full/internal-vpn-service/blob/main/docs/runbooks.md
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by(node)(rate(node_network_receive_packets_total{device!~"lo|vpn0|wg-mgmt|docker.*|veth.*|br-.*"}[2m]))
          > bool 200000) * (sum by(node)(rate(vpn_firewall_input_drops_total[2m]))
          > bool 10000)
        instant: true
        intervalMs: 20000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: math
        expression: $A > 0

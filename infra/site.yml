---
- name: Configure private VPN nodes sequentially
  hosts: vpn
  serial: 1
  become: true
  gather_facts: true
  vars:
    admin_user: vpnadmin
    secrets_for_node: "{{ node_secrets[inventory_hostname] }}"
  pre_tasks:
    - ansible.builtin.import_tasks: tasks/check-deployment.yml
    - name: Require supported operating system and complete inventory
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.architecture == 'x86_64'
          - admin_cidrs | length > 0
          - admin_public_key is match('^(ssh-ed25519|sk-ssh-ed25519@openssh.com) ')
          - vpn_backend in ['wireguard', 'amneziawg']
          - vpn_port | int != 51821
          - fleet_revision | int > 0
          - ansible_facts.default_ipv4.interface is match('^[a-zA-Z0-9_.:-]+$')
        fail_msg: Use Ubuntu 24.04 x86_64 and a generated inventory with encrypted group variables.
    - name: Check image scan freshness and exact lock
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../tools/check_image_lock.py"
          - --prepare-plugins
        stdin: "{{ images | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Check server clock against scan timestamp
      ansible.builtin.assert:
        that:
          - ansible_facts.date_time.epoch | int >= images.scanned_epoch | default(0) | int
          - ansible_facts.date_time.epoch | int - images.scanned_epoch | default(0) | int < 604800
        fail_msg: Run tools/scan_images.py with the current image lock before deployment.
  roles:
    - node
    - monitoring
  post_tasks:
    - name: Check whether the intended firewall policy still needs confirmation
      ansible.builtin.command: /usr/local/sbin/vpn-firewall status
      changed_when: false
      register: firewall_before_stage
      tags: [firewall]
    - name: Stage networking only after all potentially slow installation steps
      ansible.builtin.command: /usr/local/sbin/vpn-firewall apply
      when: (firewall_before_stage.stdout | from_json).needs_apply
      changed_when: true
      register: firewall_stage
      tags: [firewall]
    - name: Wait for operator to verify a new SSH connection and confirm firewall
      ansible.builtin.pause:
        prompt: "Open a FRESH SSH connection to {{ ansible_host }}, run sudo vpn-firewall confirm within 120s, then press Enter. A timeout rolls back to last-good/rescue policy."
      when: firewall_stage.changed
      tags: [firewall]
    - name: Read explicit firewall confirmation state
      ansible.builtin.command: /usr/local/sbin/vpn-firewall status
      changed_when: false
      register: firewall_status
      tags: [firewall]
    - name: Reject silent timeout rollback
      ansible.builtin.assert:
        that:
          - (firewall_status.stdout | from_json).status == 'confirmed'
          - not (firewall_status.stdout | from_json).needs_apply
        fail_msg: Firewall was not confirmed; retry staging and verify a new SSH connection.
